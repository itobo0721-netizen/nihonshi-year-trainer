<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>日本史 年号トレーニング</title>
<style>
:root{--bg:#101827;--panel:#1b2638;--panel2:#243249;--text:#f2f5fa;--muted:#aab6c8;--accent:#8bb8ff;--good:#55d6a0;--bad:#ff8585}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#101827,#152238);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;min-height:100vh}
main{max-width:720px;margin:auto;padding:22px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.tag{color:var(--accent);font-size:12px;letter-spacing:.12em;font-weight:700}.title{font-size:27px;margin:7px 0 4px}.sub{color:var(--muted);font-size:13px;line-height:1.6}.card{background:rgba(27,38,56,.96);border:1px solid #34445c;border-radius:18px;padding:20px;margin-top:18px;box-shadow:0 12px 35px #0003}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 7px}select,input{width:100%;background:#111c2c;border:1px solid #40516b;border-radius:11px;color:var(--text);padding:13px;font-size:16px}
button{border:0;border-radius:12px;padding:13px 15px;font-size:15px;font-weight:700;cursor:pointer;background:var(--accent);color:#102039}button.secondary{background:#34445c;color:var(--text)}button.ghost{background:transparent;color:var(--accent);border:1px solid #40516b}button:disabled{opacity:.45}
.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.row button{flex:1;min-width:120px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.stat{background:#111c2c;border-radius:12px;padding:12px}.stat b{font-size:21px;display:block}.stat span{font-size:11px;color:var(--muted)}
.question{font-size:21px;line-height:1.6;font-weight:700;margin:20px 0}.small{font-size:12px;color:var(--muted)}.feedback{margin-top:13px;padding:13px;border-radius:12px;line-height:1.6;display:none}.feedback.good{display:block;background:#12372f;color:#b7f3d9}.feedback.bad{display:block;background:#43272d;color:#ffd0d0}
.choice{display:block;width:100%;text-align:left;background:#26364d;color:var(--text);margin:8px 0;border:1px solid #40516b}.choice.correct{border-color:var(--good);background:#174234}.choice.wrong{border-color:var(--bad);background:#482b32}
.progress{height:7px;background:#34445c;border-radius:99px;overflow:hidden;margin-top:14px}.progress>div{height:100%;background:var(--accent);width:0}
.hidden{display:none!important}.footer{color:#8291a8;font-size:11px;text-align:center;margin:20px 0}.pill{font-size:11px;color:var(--accent);border:1px solid #40516b;border-radius:99px;padding:5px 9px}
@media(min-width:600px){.title{font-size:32px}.card{padding:25px}}
</style>
</head>
<body><main>
<header class="top"><div><div class="tag">JAPANESE HISTORY / YEAR TRAINING</div><h1 class="title">日本史 年号トレーニング</h1><div class="sub">共通テスト標準を目安に、出来事と年号を往復して覚える。</div></div><span class="pill">個人用</span></header>

<section id="home" class="card">
<h2 style="margin:0 0 5px">学習を始める</h2>
<div class="sub">出来事 → 年号、年号 → 出来事の両方に対応。</div>
<label for="mode">出題形式</label><select id="mode"><option value="year">出来事を見て年号を入力</option><option value="event">年号を見て出来事を選択</option><option value="mix">ランダム（両形式）</option></select>
<label for="period">時代</label><select id="period"><option value="all">全時代</option><option>原始・古代</option><option>中世</option><option>近世</option><option>近代</option><option>現代</option></select>
<label for="order">出題順</label><select id="order"><option value="random">ランダム</option><option value="chronological">年代順</option><option value="wrong">間違えた問題を優先</option></select>
<div class="row"><button id="start">演習スタート</button><button id="resetStats" class="secondary">成績リセット</button></div>
<div class="stats"><div class="stat"><b id="totalStat">0</b><span>解答数</span></div><div class="stat"><b id="rateStat">—</b><span>正答率</span></div><div class="stat"><b id="wrongStat">0</b><span>苦手問題</span></div></div>
<div class="row"><button id="export" class="ghost">学習記録をバックアップ</button><button id="importBtn" class="ghost">記録を復元</button><input id="importFile" type="file" accept="application/json" class="hidden"></div>
<p class="small">記録はこのブラウザ内に保存されます。ブラウザの履歴・Webサイトデータを消す前にバックアップしてください。</p>
</section>

<section id="quiz" class="card hidden">
<div class="top"><span id="counter" class="pill">1問目</span><span id="format" class="small"></span></div>
<div class="progress"><div id="bar"></div></div>
<div id="prompt" class="question"></div>
<div id="answerArea"></div>
<div id="feedback" class="feedback"></div>
<div class="row"><button id="check">答え合わせ</button><button id="next" class="secondary" disabled>次の問題</button></div>
<div class="row"><button id="quit" class="ghost">終了して戻る</button></div>
</section>
<section id="result" class="card hidden">
<h2>今回の結果</h2><div id="resultText" class="question"></div><div class="sub" id="resultSub"></div>
<div class="row"><button id="again">もう一度</button><button id="back" class="secondary">トップへ</button></div>
</section>
<p class="footer">初期収録：日本史の主要事項（出来事データ約150件を目標に順次拡張）</p>
</main>
<script>
const DATA = [

["1941","太平洋戦争開始","近代"],
["1945","ポツダム宣言受諾・終戦","現代"],
["1946","日本国憲法公布","現代"],
["1947","日本国憲法施行","現代"],
["1951","サンフランシスコ平和条約・日米安全保障条約","現代"],
["1956","国際連合加盟","現代"],
["1960","日米新安全保障条約","現代"],
["1964","東京オリンピック・東海道新幹線開業","現代"],
["1965","日韓基本条約","現代"],

["1973","第一次石油危機","現代"],
["1978","日中平和友好条約","現代"],
["1989","消費税導入・昭和から平成へ","現代"],
["1993","55年体制の崩壊","現代"],
["1995","阪神・淡路大震災","現代"],

["2019","令和に改元","現代"]
];
const $=id=>document.getElementById(id);
let stats=JSON.parse(localStorage.getItem("nihonshi_stats")||'{"answered":0,"correct":0,"wrong":{}}');
let session=[],index=0,answered=false,sessionCorrect=0,activeMode="year",current=null;
function save(){localStorage.setItem("nihonshi_stats",JSON.stringify(stats));updateStats()}
function updateStats(){$("totalStat").textContent=stats.answered;$("rateStat").textContent=stats.answered?Math.round(stats.correct/stats.answered*100)+"%":"—";$("wrongStat").textContent=Object.keys(stats.wrong).filter(k=>stats.wrong[k]>0).length}
function key(q){return q[0]+"|"+q[1]}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){let period=$("period").value,arr=DATA.map((q,i)=>({q,i})).filter(x=>period==="all"||x.q[2]===period);let order=$("order").value;
if(order==="wrong")arr.sort((a,b)=>(stats.wrong[key(b.q)]||0)-(stats.wrong[key(a.q)]||0));
else if(order==="random")shuffle(arr);
session=arr;index=0;sessionCorrect=0;$("home").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");showQuestion()}
function showQuestion(){if(index>=session.length){finish();return}current=session[index].q;answered=false;activeMode=$("mode").value==="mix"?(Math.random()<.5?"year":"event"):$("mode").value;
$("counter").textContent=(index+1)+" / "+session.length;$("bar").style.width=(index/session.length*100)+"%";$("format").textContent=activeMode==="year"?"年号入力":"出来事選択";
$("feedback").className="feedback";$("feedback").textContent="";$("next").disabled=true;$("check").disabled=false;
if(activeMode==="year"){$("prompt").textContent=current[1];$("answerArea").innerHTML='<label for="yearInput">西暦4桁で入力</label><input id="yearInput" type="number" inputmode="numeric" placeholder="例：1603" autocomplete="off">';$("yearInput").addEventListener("keydown",e=>{if(e.key==="Enter")check()})}
else{$("prompt").textContent="西暦 "+current[0]+" 年に起きた出来事は？";let wrong=shuffle(DATA.filter(x=>x!==current)).slice(0,3);let choices=shuffle([current,...wrong]).map(q=>`<button class="choice" data-answer="${encodeURIComponent(q[1])}">${q[1]}</button>`).join("");$("answerArea").innerHTML=choices;document.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>{if(answered)return;document.querySelectorAll(".choice").forEach(x=>x.disabled=true);b.classList.add("selected");b.dataset.selected="1"}))}
}
function check(){if(answered)return;let ok=false;if(activeMode==="year"){let v=$("yearInput").value.trim();if(!v){$("feedback").textContent="年号を入力してください。";$("feedback").className="feedback bad";return}ok=Number(v)===Number(current[0])}
else{let selected=document.querySelector('.choice[data-selected="1"]');if(!selected){$("feedback").textContent="選択肢を選んでください。";$("feedback").className="feedback bad";return}ok=decodeURIComponent(selected.dataset.answer)===current[1];document.querySelectorAll(".choice").forEach(b=>{if(decodeURIComponent(b.dataset.answer)===current[1])b.classList.add("correct");else if(b.dataset.selected)b.classList.add("wrong")})}
answered=true;stats.answered++;if(ok){stats.correct++;sessionCorrect++}else stats.wrong[key(current)]=(stats.wrong[key(current)]||0)+1;save();
$("feedback").textContent=(ok?"正解！":"不正解。")+" 正解："+current[0]+"年 — "+current[1];$("feedback").className="feedback "+(ok?"good":"bad");$("check").disabled=true;$("next").disabled=false;if(activeMode==="year")$("yearInput").disabled=true}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("resultText").textContent=sessionCorrect+" / "+session.length+" 問正解（"+(session.length?Math.round(sessionCorrect/session.length*100):0)+"%）";$("resultSub").textContent="間違えた問題はトップ画面の「間違えた問題を優先」から復習できます。"}
$("start").onclick=start;$("check").onclick=check;$("next").onclick=()=>{index++;showQuestion()};$("quit").onclick=()=>{$("quiz").classList.add("hidden");$("home").classList.remove("hidden");updateStats()};$("again").onclick=start;$("back").onclick=()=>{$("result").classList.add("hidden");$("home").classList.remove("hidden")};
$("resetStats").onclick=()=>{if(confirm("学習記録をすべてリセットしますか？")){stats={answered:0,correct:0,wrong:{}};save()}};
$("export").onclick=()=>{let blob=new Blob([JSON.stringify(stats,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="nihonshi-study-backup.json";a.click();URL.revokeObjectURL(a.href)};
$("importBtn").onclick=()=>$("importFile").click();$("importFile").onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(typeof x.answered!=="number"||typeof x.wrong!=="object")throw 0;stats=x;save();alert("記録を復元しました")}catch{alert("バックアップファイルを読み込めませんでした")}};
updateStats();
</script></body></html>
